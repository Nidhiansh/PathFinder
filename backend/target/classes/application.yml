server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: learning-path-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  ai-service:
    url: ${APP_AI_SERVICE_URL:${AI_SERVICE_URL:http://localhost:8000}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
