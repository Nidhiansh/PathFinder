version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learning-path-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learningpathdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learningpathdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learning-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: learning-path-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - learning-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-path-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learningpathdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      APP_AI_SERVICE_URL: http://ai-service:8000
      APP_JWT_SECRET: c2VjdXJla2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      APP_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    networks:
      - learning-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-path-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - learning-network

volumes:
  postgres_data:

networks:
  learning-network:
    driver: bridge
